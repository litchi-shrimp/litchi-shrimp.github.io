<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同智能生成</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --bg-white: #ffffff;
            --bg-sidebar: #f0f0f0;
            --bg-hover: #e8e8e8;
            --bg-active: #e0e0e0;
            --bg-input: #f5f5f5;
            --border: #e0e0e0;
            --border-light: #eeeeee;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --accent-hover: #4338ca;
            --gold: #d4a017;
            --green: #16a34a;
            --green-bg: #f0fdf4;
            --red: #dc2626;
            --red-bg: #fef2f2;
            --orange: #ea580c;
            --orange-bg: #fff7ed;
            --purple: #7c3aed;
            --blue: #2563eb;
            --cyan: #0891b2;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 4px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', consolas, monospace;
            --sidebar-width: 280px;
            --sidebar-collapsed: 0px;
            --outline-width: 0px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: var(--sidebar-width);
            min-width: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width var(--transition), opacity var(--transition);
            overflow: hidden;
            z-index: 20;
        }

        .sidebar.collapsed {
            width: 0;
            border-right: none;
        }

        .sidebar-header {
            padding: 16px;
            flex-shrink: 0;
        }

        .btn-new-chat {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }

        .btn-new-chat:hover {
            background: var(--bg-hover);
            border-color: #ccc;
        }

        .sidebar-history {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        .sidebar-history .section-title {
            font-size: 11px;
            color: var(--text-muted);
            padding: 8px 8px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition);
            font-size: 13px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
        }

        .history-item:hover {
            background: var(--bg-hover);
        }

        .history-item.active {
            background: var(--bg-active);
            font-weight: 500;
        }

        .history-item .icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .history-item .info {
            flex: 1;
            min-width: 0;
        }

        .history-item .title {
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item .time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .history-item .actions {
            display: none;
            gap: 2px;
            flex-shrink: 0;
        }

        .history-item:hover .actions {
            display: flex;
        }

        .history-item .del-btn,
        .history-item .stop-btn {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .history-item .del-btn:hover {
            color: var(--red);
            background: var(--red-bg);
        }

        .history-item .stop-btn:hover {
            color: var(--orange);
            background: var(--orange-bg);
        }

        .history-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 24px 12px;
            white-space: nowrap;
        }

        /* ============ MAIN ============ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .main-header {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-white);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            min-height: 52px;
        }

        .btn-toggle-sidebar {
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-xs);
            color: var(--text-secondary);
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .btn-toggle-sidebar:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .main-header .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.idle {
            background: #ccc;
        }

        .status-dot.connected {
            background: var(--green);
        }

        .status-dot.running {
            background: var(--orange);
            animation: pulse 1.2s infinite;
        }

        .status-dot.error {
            background: var(--red);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .btn-toggle-outline {
            padding: 5px 14px;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--bg-white);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
            font-family: var(--font);
        }

        .btn-toggle-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-toggle-outline.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ============ CHAT AREA ============ */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-white);
        }

        .chat-welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 12px;
            padding: 40px;
        }

        .chat-welcome .icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .chat-welcome .title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .chat-welcome .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
        }

        /* Message Styles */
        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 80%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-row.agent {
            align-self: flex-start;
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.system {
            align-self: center;
            max-width: 100%;
        }

        .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .msg-row.agent .msg-avatar {
            background: var(--accent-light);
        }

        .msg-row.user .msg-avatar {
            background: #e0e7ff;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.65;
            word-break: break-word;
            position: relative;
        }

        .msg-row.agent .msg-bubble {
            background: #f5f5f5;
            border-radius: 4px 12px 12px 12px;
        }

        .msg-row.user .msg-bubble {
            background: var(--accent-light);
            border-radius: 12px 4px 12px 12px;
        }

        .msg-row.system .msg-bubble {
            background: none;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 4px 8px;
            max-width: 100%;
        }

        .msg-row.error .msg-bubble {
            background: var(--red-bg);
            color: var(--red);
            border-radius: var(--radius-sm);
        }

        .msg-bubble .msg-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* Processing indicator — single-line status bar */
        .processing-indicator {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: var(--radius-xs);
            background: #f8f8f8;
            border: 1px solid var(--border-light);
            font-size: 12px;
            font-family: var(--font-mono);
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: fadeIn 0.2s ease;
        }

        .processing-indicator .proc-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--orange);
            animation: pulse 1.2s infinite;
            flex-shrink: 0;
        }

        .processing-indicator.done .proc-dot {
            background: var(--green);
            animation: none;
        }

        .processing-indicator .proc-content {
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
        }

        .processing-indicator .proc-content.think {
            color: var(--purple);
        }

        .processing-indicator .proc-content.act {
            color: var(--orange);
        }

        .streaming-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: var(--accent);
            font-weight: 100;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Step progress indicator */
        .step-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .step-indicator .step-num {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ============ INPUT AREA ============ */
        .input-area {
            padding: 12px 20px 16px;
            background: var(--bg-white);
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px 4px 4px 16px;
            transition: border-color var(--transition);
        }

        .input-row:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .input-row textarea {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
            font-family: var(--font);
            resize: none;
            padding: 8px 0;
            line-height: 1.5;
            min-height: 24px;
            max-height: 120px;
        }

        .input-row textarea::placeholder {
            color: var(--text-muted);
        }

        .input-row textarea:disabled {
            opacity: 0.5;
        }

        .btn-send {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .btn-send:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-sample {
            padding: 4px 10px;
            font-size: 11px;
            border: 1px dashed var(--border);
            border-radius: var(--radius-xs);
            background: var(--bg-white);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }

        .btn-sample:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        .input-hint {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 6px;
        }

        /* ============ OUTLINE PANEL (Right) ============ */
        .outline-panel {
            width: var(--outline-width);
            min-width: 0;
            background: var(--bg-white);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width var(--transition);
            overflow: hidden;
            z-index: 10;
            position: relative;
        }

        .outline-panel.open {
            width: 380px;
        }

        .outline-resize-handle {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: col-resize;
            z-index: 5;
        }

        .outline-resize-handle:hover,
        .outline-resize-handle.active {
            background: var(--accent);
            opacity: 0.3;
        }

        .outline-panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .outline-panel-header .close-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-xs);
            color: var(--text-muted);
        }

        .outline-panel-header .close-btn:hover {
            background: var(--bg-hover);
        }

        .outline-panel-body {
            flex: 1;
            overflow-y: auto;
            background: #e8e8e8;
        }

        /* Document page */
        .doc-page {
            background: #fff;
            margin: 20px 16px;
            padding: 44px 40px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
            min-height: calc(100% - 40px);
            font-size: 14px;
            line-height: 1.85;
            color: #333;
            font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
        }

        .doc-title {
            text-align: center;
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: 2px;
            font-family: "SimHei", "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            color: #1a1a1a;
        }

        .doc-section {
            font-size: 15px;
            font-weight: 700;
            margin: 20px 0 10px;
            font-family: "SimHei", "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            color: #1a1a1a;
        }

        .doc-clause {
            font-size: 14px;
            font-weight: 600;
            margin: 14px 0 6px;
            padding-left: 8px;
            font-family: "SimHei", "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            color: #222;
        }

        .doc-sub {
            font-size: 13px;
            font-weight: 500;
            margin: 8px 0 3px;
            padding-left: 20px;
            color: #333;
        }

        .doc-text {
            font-size: 13px;
            margin: 3px 0 8px;
            padding-left: 36px;
            color: #555;
        }

        .doc-preamble {
            font-size: 13px;
            margin: 6px 0;
            white-space: pre-wrap;
            color: #444;
        }

        .doc-section .locator,
        .doc-clause .locator,
        .doc-sub .locator,
        .doc-text .locator {
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 400;
            margin-left: 4px;
            opacity: 0.5;
            user-select: none;
        }

        /* Diff highlights */
        .doc-highlight-new {
            animation: docNew 2.5s ease forwards;
        }

        .doc-highlight-edit {
            animation: docEdit 2.5s ease forwards;
        }

        @keyframes docNew {
            0% {
                background: rgba(22, 163, 74, 0.18);
            }

            100% {
                background: transparent;
            }
        }

        @keyframes docEdit {
            0% {
                background: rgba(79, 70, 229, 0.12);
            }

            100% {
                background: transparent;
            }
        }

        .outline-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-size: 13px;
        }

        .outline-section-header {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 16px 6px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b0b0b0;
        }

        .chat-area::-webkit-scrollbar {
            width: 5px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            z-index: 100;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
            pointer-events: none;
        }

        .toast.success {
            background: #166534;
            color: #fff;
        }

        .toast.warning {
            background: var(--orange);
            color: #fff;
        }

        .toast.error {
            background: var(--red);
            color: #fff;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                border: none;
            }

            .sidebar.open {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 280px;
                box-shadow: var(--shadow-md);
            }

            .outline-panel.open {
                width: 280px;
            }

            .msg-row {
                max-width: 92%;
            }
        }
    </style>
</head>

<body>

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" onclick="newSession()" title="新建会话">
                <span>+</span> 新建合同会话
            </button>
        </div>
        <div class="sidebar-history" id="historyList">
            <div class="section-title">历史会话</div>
            <div class="history-empty" id="historyEmpty">暂无历史会话</div>
        </div>
        <div class="sidebar-footer" style="padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0;">
            <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;white-space:nowrap;">服务地址</div>
            <input type="text" id="serverUrl" value="http://8.149.244.29:8001"
                style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:var(--font-mono);outline:none;background:var(--bg-white);color:var(--text);"
                onchange="saveServerUrl()">
        </div>
    </aside>

    <!-- ==================== MAIN ==================== -->
    <div class="main">
        <div class="main-header">
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="展开/收起侧边栏">☰</button>
            <span class="title" id="headerTitle">合同智能生成（当前页面仅作简单示例演示）</span>
            <span class="status-dot idle" id="statusDot" title="连接状态"></span>
            <button class="btn-toggle-outline" id="btnToggleOutline" onclick="toggleOutlinePanel()" title="显示/隐藏合同大纲">
                📋 大纲 <span id="outlineBadge" style="display:none">0</span>
            </button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-welcome" id="chatWelcome">
                <span class="icon">📄</span>
                <span class="title">合同智能生成</span>
                <span class="subtitle">点击左侧「新建合同会话」开始，告诉我您的合同需求，我会帮您逐步生成专业合同</span>
            </div>
        </div>

        <div class="input-area">
            <div class="input-row">
                <textarea id="userInput" placeholder="输入您的需求或回复..." rows="1" disabled
                    onkeydown="handleInputKey(event)"></textarea>
                <button class="btn-send" id="btnSend" onclick="sendUserInput()" disabled title="发送">
                    ↑
                </button>
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
                <button class="btn-sample" id="btnSample" onclick="fillSampleText()" style="display:none;"
                    title="填充示例合同需求">
                    📋 填充示例文本
                </button>
                <span style="flex:1;"></span>
            </div>
            <div class="input-hint" id="inputHint">新建会话后即可开始</div>
        </div>
    </div>

    <!-- ==================== OUTLINE PANEL ==================== -->
    <aside class="outline-panel" id="outlinePanel">
        <div class="outline-resize-handle" id="outlineResizeHandle"></div>
        <div class="outline-panel-header">
            <span>📋 合同大纲</span>
            <button class="close-btn" onclick="toggleOutlinePanel()">✕</button>
        </div>
        <div class="outline-panel-body" id="outlinePanelBody">
            <div class="outline-empty" id="outlineEmpty">等待大纲生成…</div>
            <div class="doc-page" id="docPage" style="display:none"></div>
        </div>
    </aside>

    <script>
        // ==================== STATE ====================
        const LS_PREFIX = 'cg_sessions_v2';
        const LS_ACTIVE = 'cg_active_v2';

        let state = {
            sessionId: null,
            eventSource: null,
            connected: false,
            waitingInput: false,
            currentStep: 0,
            currentStepName: '',
            currentAgent: '',
            workflowStart: null,
            sessionTitle: '',
            // Chat
            currentProcessingPanel: null,  // single-line processing indicator
            _typewriterCancel: null,       // cancel function for agent.ask typewriter
            _streamBuffer: '',             // buffer for think/act streaming text
            _streamType: '',               // current stream type: 'think' | 'act'
            // Outline
            outlineJson: null,
            prevOutlineJson: null,       // for diff
            outlineChapters: 0,
            outlineVisible: false,
            outlineAutoShown: false,     // only auto-show once per session
            // Stats
            eventCount: 0,
            totalPromptTokens: 0,
            totalCompletionTokens: 0,
            errorCount: 0,
        };

        // ==================== LOCAL STORAGE ====================
        function loadSessions() {
            try { return JSON.parse(localStorage.getItem(LS_PREFIX) || '[]'); } catch (_) { return []; }
        }

        function saveSessions(sessions) {
            try { localStorage.setItem(LS_PREFIX, JSON.stringify(sessions)); } catch (_) { }
        }

        function getActiveSessionId() {
            return localStorage.getItem(LS_ACTIVE) || null;
        }

        function setActiveSessionId(id) {
            if (id) localStorage.setItem(LS_ACTIVE, id);
            else localStorage.removeItem(LS_ACTIVE);
        }

        function updateSessionRecord(sessionId, updates) {
            if (!sessionId) return;
            const sessions = loadSessions();
            const idx = sessions.findIndex(s => s.id === sessionId);
            if (idx < 0) {
                console.warn('[updateSessionRecord] 会话不存在，跳过更新', sessionId, new Error().stack);
                return;
            }
            Object.assign(sessions[idx], updates);
            saveSessions(sessions);
            renderHistory();
        }

        function createSessionRecord(sessionId, data) {
            if (!sessionId) return;
            const sessions = loadSessions();
            const idx = sessions.findIndex(s => s.id === sessionId);
            if (idx >= 0) {
                // 已存在则更新
                Object.assign(sessions[idx], data);
            } else {
                sessions.unshift({ id: sessionId, ...data });
            }
            saveSessions(sessions);
            renderHistory();
        }

        function deleteSessionRecord(sessionId) {
            let sessions = loadSessions();
            sessions = sessions.filter(s => s.id !== sessionId);
            saveSessions(sessions);
            if (getActiveSessionId() === sessionId) setActiveSessionId(null);
            renderHistory();
        }

        async function cancelSession(sessionId) {
            if (!confirm('确定要中断此会话吗？所有进行中的操作将被停止。')) return;
            try {
                const baseUrl = getBaseUrl();
                const resp = await fetch(`${baseUrl}/api/contract/session/${sessionId}`, { method: 'DELETE' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                updateSessionRecord(sessionId, { status: 'cancelled', lastActive: Date.now() });
                if (state.sessionId === sessionId) {
                    if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
                    state.connected = false;
                    state.waitingInput = false;
                    document.getElementById('statusDot').className = 'status-dot idle';
                    document.getElementById('userInput').disabled = true;
                    document.getElementById('btnSend').disabled = true;
                    document.getElementById('inputHint').textContent = '会话已中断';
                    addSystemMsg('⛔ 会话已被中断');
                }
                showToast('会话已中断', 'warning');
            } catch (e) {
                showToast(`中断失败：${e.message}`, 'error');
            }
        }

        function renderHistory() {
            const sessions = loadSessions();
            const list = document.getElementById('historyList');
            const empty = document.getElementById('historyEmpty');
            // Clear old items
            list.querySelectorAll('.history-item').forEach(el => el.remove());

            if (sessions.length === 0) {
                empty.style.display = '';
                return;
            }
            empty.style.display = 'none';

            const activeId = getActiveSessionId();
            sessions.forEach(s => {
                const isActive = s.id === activeId;
                const div = document.createElement('div');
                div.className = 'history-item' + (isActive ? ' active' : '');
                div.title = s.title || s.id;
                const statusIcon = s.status === 'completed' ? '✅' : s.status === 'cancelled' ? '⛔' : '💬';
                div.innerHTML = `
                    <span class="icon">${statusIcon}</span>
                    <span class="info">
                        <div class="title">${escHtml(s.title || s.id || '(无标题)')}</div>
                        <div class="time">${s.createdAt ? fmtTime(s.createdAt) : ''}</div>
                    </span>
                    <span class="actions">
                        ${isActive && s.status !== 'completed' && s.status !== 'cancelled' ? `<span class="stop-btn" title="中断" onclick="event.stopPropagation();cancelSession('${s.id}')">⏹</span>` : ''}
                        <span class="del-btn" title="删除" onclick="event.stopPropagation();deleteSessionRecord('${s.id}')">🗑</span>
                    </span>
                `;
                div.onclick = () => {
                    if (s.id === state.sessionId) return;
                    switchToSession(s);
                };
                list.appendChild(div);
            });
        }

        function switchToSession(session) {
            if (state.sessionId && state.sessionId !== session.id) {
                updateSessionRecord(state.sessionId, { lastActive: Date.now() });
            }
            setActiveSessionId(session.id);
            state.sessionId = session.id;
            state.sessionTitle = session.title || '';
            document.getElementById('headerTitle').textContent = session.title || '合同智能生成';
            document.getElementById('chatWelcome').style.display = 'none';
            document.getElementById('userInput').disabled = false;
            document.getElementById('btnSend').disabled = false;
            document.getElementById('btnSample').style.display = '';
            document.getElementById('inputHint').textContent = '输入内容后按 Enter 发送';
            document.getElementById('statusDot').className = 'status-dot connected';
            renderHistory();
            connectSSE();
            showToast('已切换会话', 'success');
        }

        function newSession() {
            if (state._creatingSession) return;
            state._creatingSession = true;
            if (state.sessionId) {
                updateSessionRecord(state.sessionId, { lastActive: Date.now() });
            }
            resetUI();
            startSession().finally(() => { state._creatingSession = false; });
            document.getElementById('sidebar').classList.remove('collapsed');
        }

        function resetUI() {
            if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
            state.sessionId = null;
            state.connected = false;
            state.waitingInput = false;
            state.currentStep = 0;
            state.currentStepName = '';
            state.currentAgent = '';
            state.workflowStart = null;
            state.sessionTitle = '';
            if (state._typewriterCancel) { state._typewriterCancel(); }
            state.currentProcessingPanel = null;
            state._typewriterCancel = null;
            state._streamBuffer = '';
            state._streamType = '';
            state.outlineJson = null;
            state.prevOutlineJson = null;
            state.outlineChapters = 0;
            state.eventCount = 0;
            state.totalPromptTokens = 0;
            state.totalCompletionTokens = 0;
            state.errorCount = 0;

            document.getElementById('chatArea').querySelectorAll('.msg-row').forEach(el => el.remove());
            document.getElementById('chatWelcome').style.display = '';
            document.getElementById('headerTitle').textContent = '合同智能生成';
            document.getElementById('statusDot').className = 'status-dot idle';
            document.getElementById('userInput').disabled = true;
            document.getElementById('userInput').value = '';
            document.getElementById('btnSend').disabled = true;
            document.getElementById('btnSample').style.display = 'none';
            document.getElementById('inputHint').textContent = '新建会话后即可开始';
            document.getElementById('outlineBadge').style.display = 'none';
            document.getElementById('outlineBadge').textContent = '0';
            document.getElementById('docPage').innerHTML = '';
            document.getElementById('docPage').style.display = 'none';
            document.getElementById('outlineEmpty').style.display = '';
            document.getElementById('btnToggleOutline').classList.remove('active');
        }

        // ==================== API ====================
        function getBaseUrl() {
            const el = document.getElementById('serverUrl');
            if (el && el.value) return el.value.replace(/\/+$/, '');
            return (window.SERVER_URL || 'http://8.149.244.29:8001').replace(/\/+$/, '');
        }

        function fillSampleText() {
            const input = document.getElementById('userInput');
            if (input.disabled) return;
            const sample = '我们是一家游戏开发公司，想和一家渠道推广公司签一份数字内容授权协议。我们需要把我们的一款手游的角色形象、宣传视频、游戏截图这些素材授权给对方，让他们在江苏地区做市场推广用。合作期限大概是一年，授权范围只限推广用途，不能转授权。我们比较关注授权内容的范围界定、使用限制、费用结算（可能按推广效果分成）以及如果对方用了我们的素材做了违法或损害我们品牌的事情要承担的责任。另外，由于我们的素材涉及一些未公开的新版本内容，还需要加上保密条款。整体上希望合同稍微详细、规范一些，能应对比较复杂的商业场景。请帮我生成这样一份合同。';
            input.value = sample;
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            input.focus();
        }

        function saveServerUrl() {
            const url = document.getElementById('serverUrl').value.trim() || 'http://8.149.244.29:8001';
            try { localStorage.setItem('cg_server_url', url); } catch (_) { }
        }

        function loadServerUrl() {
            try {
                const url = localStorage.getItem('cg_server_url');
                if (url) document.getElementById('serverUrl').value = url;
            } catch (_) { }
        }

        async function startSession() {
            const baseUrl = getBaseUrl();
            const welcomeEl = document.getElementById('chatWelcome');
            welcomeEl.style.display = 'none';
            addSystemMsg('⏳ 正在创建会话…');

            try {
                const resp = await fetch(`${baseUrl}/api/contract/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timeout_seconds: 3600 })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                state.sessionId = data.session_id;
                setActiveSessionId(data.session_id);
                const now = Date.now();
                const titleText = new Date(now).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                state.sessionTitle = titleText;
                document.getElementById('headerTitle').textContent = titleText;
                createSessionRecord(data.session_id, {
                    title: titleText,
                    createdAt: now,
                    lastActive: now,
                    status: 'started',
                });
                renderHistory();
                document.getElementById('userInput').disabled = false;
                document.getElementById('btnSend').disabled = false;
                document.getElementById('btnSample').style.display = '';
                document.getElementById('inputHint').textContent = '输入内容后按 Enter 发送';
                document.getElementById('statusDot').className = 'status-dot connected';
                addSystemMsg('✅ 会话已创建，等待服务响应…');
                connectSSE();
            } catch (e) {
                addErrorMsg(`创建会话失败：${e.message}`);
                document.getElementById('chatWelcome').style.display = '';
            }
        }

        function connectSSE() {
            if (!state.sessionId) return;
            if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }

            const baseUrl = getBaseUrl();
            const url = `${baseUrl}/api/contract/generate/sse?session_id=${state.sessionId}`;
            state.eventSource = new EventSource(url);

            state.eventSource.onopen = () => {
                state.connected = true;
                document.getElementById('statusDot').className = 'status-dot connected';
            };

            state.eventSource.onerror = () => {
                if (state.eventSource && state.eventSource.readyState === EventSource.CLOSED) {
                    state.connected = false;
                    document.getElementById('statusDot').className = 'status-dot error';
                    document.getElementById('userInput').disabled = true;
                    document.getElementById('btnSend').disabled = true;
                }
            };

            state.eventSource.onmessage = (e) => {
                try {
                    const evt = JSON.parse(e.data);
                    handleEvent(evt);
                } catch (_) { }
            };
        }

        async function sendUserInput() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || !state.sessionId) return;
            input.value = '';
            input.style.height = 'auto';

            addUserMsg(text);

            const baseUrl = getBaseUrl();
            try {
                await fetch(`${baseUrl}/api/contract/user-input`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: state.sessionId, text })
                });
            } catch (e) {
                addErrorMsg(`发送失败：${e.message}`);
            }
        }

        // ==================== EVENT HANDLING ====================
        function handleEvent(evt) {
            const type = evt.event_type || '';
            const data = evt.data || {};
            const agent = evt.agent || '';
            const step = evt.step;

            state.eventCount++;

            switch (type) {
                // Workflow
                case 'workflow.start':
                    state.workflowStart = evt.timestamp;
                    addSystemMsg(`🚀 合同生成流程启动（共 ${data.steps_total || 8} 步）`);
                    break;
                case 'workflow.complete':
                    const dur = state.workflowStart ?
                        ((evt.timestamp - state.workflowStart) / 60).toFixed(1) :
                        '?';
                    addSystemMsg(`✅ 流程完成，总耗时约 ${dur} 分钟`);
                    document.getElementById('statusDot').className = 'status-dot connected';
                    updateSessionRecord(state.sessionId, { status: 'completed', lastActive: Date.now() });
                    break;

                // Steps
                case 'step.start':
                    state.currentStep = step || 0;
                    state.currentStepName = data.step_name || '';
                    addStepIndicator(step, data.step_name, 'start');
                    break;
                case 'step.complete':
                    addStepIndicator(step, data.step_name, 'complete', data.duration);
                    break;
                case 'step.error':
                    addErrorMsg(`步骤 ${step}「${data.step_name || ''}」失败：${data.error || ''}`);
                    break;

                // Session title update from backend
                case 'session.title':
                    if (data.contract_type) {
                        const sessions = loadSessions();
                        const s = sessions.find(s => s.id === state.sessionId);
                        const timeStr = s && s.createdAt ? new Date(s.createdAt).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
                        const newTitle = timeStr ? `${data.contract_type} - ${timeStr}` : data.contract_type;
                        state.sessionTitle = newTitle;
                        document.getElementById('headerTitle').textContent = newTitle;
                        updateSessionRecord(state.sessionId, { title: newTitle });
                    }
                    break;

                // Agent lifecycle
                case 'agent.start':
                    state.currentAgent = agent;
                    break;
                case 'agent.end':
                    break;
                // ReAct thinking (non-streaming) — append to processing panel
                case 'agent.think':
                    updateProcessingLine('think', data.content || '');
                    break;
                case 'agent.act':
                    updateProcessingLine('act',
                        `[${data.act_type || '?'}] ${JSON.stringify(data.params || {})}`);
                    break;
                case 'agent.complete':
                    // Panel stays alive until next agent.ask
                    break;

                // Streaming think/act — append to processing panel
                case 'agent.think.stream':
                    updateProcessingLine('think', data.text || '');
                    break;
                case 'agent.act.stream':
                    updateProcessingLine('act', data.text || '');
                    break;
                case 'agent.answer.stream':
                    // Answer text is NOT displayed in chat per user requirement
                    break;

                // Outline updates
                case 'agent.outline.stream':
                    handleOutlineUpdate(data.text || '');
                    break;

                // Agent asks user — typewriter streaming
                case 'agent.ask':
                    finalizeProcessingPanel();
                    state.waitingInput = true;
                    streamAgentAsk(data.question || '', agent);
                    document.getElementById('userInput').placeholder = '请输入您的回复...';
                    document.getElementById('userInput').focus();
                    document.getElementById('inputHint').textContent = '等待您的回复…';
                    updateSessionRecord(state.sessionId, {
                        title: state.sessionTitle || getStepTitle(),
                        lastActive: Date.now(),
                        status: 'waiting_input',
                    });
                    break;

                // User input echo
                case 'user.input':
                    // Already shown via sendUserInput
                    state.waitingInput = false;
                    document.getElementById('userInput').placeholder = '输入内容后按 Enter 发送…';
                    document.getElementById('inputHint').textContent = '处理中…';
                    break;

                // LLM events
                case 'llm.start':
                    // Ensure panel exists for upcoming think/act events
                    getOrCreateProcessingPanel();
                    break;
                case 'llm.token':
                    break;
                case 'llm.done':
                    const usage = data.usage || {};
                    if (usage.completion_tokens) state.totalCompletionTokens += usage.completion_tokens;
                    if (usage.prompt_tokens) state.totalPromptTokens += usage.prompt_tokens;
                    // Panel stays alive — don't finalize, keep accumulating
                    break;
                case 'llm.error':
                    addErrorMsg(`LLM 错误：${data.error || ''} (重试${data.retry_count || 0}次)`);
                    break;

                // Tool calls — silently ignored per user requirement

                // Parallel — silently ignored per user requirement

                // Session
                case 'session.ping':
                    break; // ignore
                case 'session.timeout':
                    addSystemMsg('⚠️ 会话已超时');
                    break;
                case 'session.end':
                    addSystemMsg(`会话结束：${data.reason || ''}`);
                    break;

                // Error
                case 'error':
                    state.errorCount++;
                    addErrorMsg(`[${data.source || ''}] ${data.message || JSON.stringify(data)}`);
                    break;

                default:
                // Silently ignore unknown events
            }
        }

        function getStepTitle() {
            const names = {
                1: '需求提取',
                2: '模板匹配',
                3: '大纲生成',
                4: '大纲修改',
                5: '合同起草',
                6: '合同审查',
                7: 'Leader修订',
                8: '终稿确认',
            };
            return names[state.currentStep] ? `Step ${state.currentStep}: ${names[state.currentStep]}` : '';
        }

        // ==================== CHAT RENDERING ====================
        function ensureChatVisible() {
            document.getElementById('chatWelcome').style.display = 'none';
        }

        function addSystemMsg(text) {
            ensureChatVisible();
            const row = document.createElement('div');
            row.className = 'msg-row system';
            row.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
            appendAndScroll(row);
        }

        function addErrorMsg(text) {
            ensureChatVisible();
            const row = document.createElement('div');
            row.className = 'msg-row system error';
            row.innerHTML = `<div class="msg-bubble">❌ ${escHtml(text)}</div>`;
            appendAndScroll(row);
        }

        function addStepIndicator(step, name, phase, duration) {
            ensureChatVisible();
            const row = document.createElement('div');
            row.className = 'msg-row system';
            const icon = phase === 'start' ? '⏳' : '✅';
            const dur = duration ? ` (${duration.toFixed(1)}s)` : '';
            row.innerHTML =
                `<div class="msg-bubble"><span class="step-num">${step || ''}</span> ${icon} ${name || ''}${dur}</div>`;
            appendAndScroll(row);
        }

        function addUserMsg(text) {
            ensureChatVisible();
            finalizeProcessingPanel();
            const row = document.createElement('div');
            row.className = 'msg-row user';
            row.innerHTML = `
                <div class="msg-avatar">👤</div>
                <div class="msg-bubble">${escHtml(text)}</div>
            `;
            appendAndScroll(row);
        }

        // ==================== PROCESSING INDICATOR (single-line think/act) ====================
        function getOrCreateProcessingPanel() {
            if (state.currentProcessingPanel && state.currentProcessingPanel.parentNode) {
                return state.currentProcessingPanel;
            }
            state._streamBuffer = '';
            state._streamType = '';
            ensureChatVisible();
            const row = document.createElement('div');
            row.className = 'msg-row system';
            const indicator = document.createElement('div');
            indicator.className = 'processing-indicator';
            indicator.innerHTML = `
                <span class="proc-dot"></span>
                <span class="proc-content"></span>
            `;
            row.appendChild(indicator);
            document.getElementById('chatArea').appendChild(row);
            state.currentProcessingPanel = indicator;
            scrollChatToBottom();
            return indicator;
        }

        function updateProcessingLine(type, text) {
            const indicator = getOrCreateProcessingPanel();
            const content = indicator.querySelector('.proc-content');
            // Type changed → reset buffer and CSS class
            if (state._streamType !== type) {
                state._streamBuffer = '';
                state._streamType = type;
                content.className = `proc-content ${type}`;
            }
            state._streamBuffer += text;
            const prefix = type === 'think' ? '💭' : '⚡';
            content.textContent = `${prefix} ${state._streamBuffer}`;
            scrollChatToBottom();
        }

        function finalizeProcessingPanel() {
            if (state.currentProcessingPanel) {
                state.currentProcessingPanel.classList.add('done');
                state.currentProcessingPanel = null;
                state._streamBuffer = '';
                state._streamType = '';
            }
        }

        // ==================== AGENT ASK TYPWRITER ====================
        function streamAgentAsk(text, agentName) {
            ensureChatVisible();
            // Cancel any ongoing typewriter
            if (state._typewriterCancel) {
                state._typewriterCancel();
                state._typewriterCancel = null;
            }

            const row = document.createElement('div');
            row.className = 'msg-row agent';
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            if (agentName) {
                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                meta.textContent = agentName;
                bubble.appendChild(meta);
            }
            const textSpan = document.createElement('span');
            textSpan.className = 'stream-text';
            bubble.appendChild(textSpan);
            const cursor = document.createElement('span');
            cursor.className = 'streaming-cursor';
            bubble.appendChild(cursor);
            row.innerHTML = '<div class="msg-avatar">🤖</div>';
            row.appendChild(bubble);
            document.getElementById('chatArea').appendChild(row);
            scrollChatToBottom();

            let idx = 0;
            let cancelled = false;
            state._typewriterCancel = () => { cancelled = true; };

            function typeNext() {
                if (cancelled) return;
                if (idx >= text.length) {
                    cursor.remove();
                    state._typewriterCancel = null;
                    return;
                }
                const batch = Math.min(2, text.length - idx);
                textSpan.textContent += text.slice(idx, idx + batch);
                idx += batch;
                scrollChatToBottom();
                setTimeout(typeNext, 25 + Math.random() * 20);
            }

            typeNext();
        }

        function appendAndScroll(el) {
            const chat = document.getElementById('chatArea');
            chat.appendChild(el);
            scrollChatToBottom();
        }

        function scrollChatToBottom() {
            const chat = document.getElementById('chatArea');
            requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
        }

        // ==================== OUTLINE PANEL ====================
        function handleOutlineUpdate(jsonText) {
            state.prevOutlineJson = state.outlineJson;
            try { state.outlineJson = JSON.parse(jsonText); } catch (_) { return; }

            // Auto-show panel on first outline event only
            if (!state.outlineAutoShown) {
                showOutlinePanel(true);
                state.outlineAutoShown = true;
            }

            renderOutline();
            document.getElementById('outlineBadge').style.display = '';
            document.getElementById('outlineBadge').textContent = state.outlineChapters;
            document.getElementById('btnToggleOutline').classList.add('active');
            // Title update
            if (state.currentStep === 3 || state.currentStep === 5) {
                updateSessionRecord(state.sessionId, {
                    title: state.sessionTitle || '合同生成中…',
                    lastActive: Date.now(),
                });
            }
        }

        function renderOutline() {
            const data = state.outlineJson;
            if (!data || typeof data !== 'object') return;

            let outline = data;
            if (outline['标准化模板文本'] && typeof outline['标准化模板文本'] === 'object') {
                outline = outline['标准化模板文本'];
            }
            if (!outline['合同首部'] && !Array.isArray(outline['正文章节'])) return;

            const docPage = document.getElementById('docPage');
            const empty = document.getElementById('outlineEmpty');
            docPage.innerHTML = '';
            docPage.style.display = '';
            empty.style.display = 'none';

            let chapters = 0;

            // Title
            const title = document.createElement('div');
            title.className = 'doc-title';
            title.textContent = '合同大纲';
            docPage.appendChild(title);

            // Preamble (合同首部)
            if (outline['合同首部']) {
                const preamble = document.createElement('div');
                preamble.className = 'doc-preamble';
                preamble.setAttribute('data-locator', 'header');
                preamble.textContent = outline['合同首部'];
                docPage.appendChild(preamble);
            }

            // Body (正文章节)
            const sections = outline['正文章节'] || [];
            sections.forEach(section => {
                chapters++;
                const loc = section['locator'] || '';
                const num = section['章节编号'] || '';
                const titleText = section['章节标题'] || '';

                const secDiv = document.createElement('div');
                secDiv.className = 'doc-section';
                secDiv.setAttribute('data-locator', loc);
                secDiv.textContent = `${num} ${titleText}`;
                if (loc) secDiv.innerHTML += `<span class="locator">${escHtml(loc)}</span>`;
                docPage.appendChild(secDiv);

                const clauses = section['条款列表'] || [];
                clauses.forEach(clause => {
                    const cLoc = clause['locator'] || '';
                    const cNum = clause['条款编号'] || '';
                    const cDesc = clause['条款大致说明'] || '';

                    const clDiv = document.createElement('div');
                    clDiv.className = 'doc-clause';
                    clDiv.setAttribute('data-locator', cLoc);
                    clDiv.textContent = `${cNum} ${cDesc}`;
                    if (cLoc) clDiv.innerHTML += `<span class="locator">${escHtml(cLoc)}</span>`;
                    docPage.appendChild(clDiv);

                    const subClauses = clause['子条款列表'] || [];
                    subClauses.forEach(sub => {
                        const sLoc = sub['locator'] || '';
                        const sNum = sub['子条款编号'] || '';
                        const sDesc = sub['子条款大致说明'] || '';

                        const subDiv = document.createElement('div');
                        subDiv.className = 'doc-sub';
                        subDiv.setAttribute('data-locator', sLoc);
                        subDiv.textContent = `${sNum} ${sDesc}`;
                        if (sLoc) subDiv.innerHTML += `<span class="locator">${escHtml(sLoc)}</span>`;
                        docPage.appendChild(subDiv);

                        const subSubClauses = sub['子子条款列表'] || [];
                        subSubClauses.forEach(ss => {
                            const ssLoc = ss['locator'] || '';
                            const ssNum = ss['子子条款编号'] || '';
                            const ssDesc = ss['子子条款大致说明'] || '';

                            const ssDiv = document.createElement('div');
                            ssDiv.className = 'doc-text';
                            ssDiv.setAttribute('data-locator', ssLoc);
                            ssDiv.textContent = `${ssNum} ${ssDesc}`;
                            if (ssLoc) ssDiv.innerHTML += `<span class="locator">${escHtml(ssLoc)}</span>`;
                            docPage.appendChild(ssDiv);
                        });
                    });
                });
            });

            // Footer (合同尾部)
            if (outline['合同尾部']) {
                const footer = document.createElement('div');
                footer.className = 'doc-preamble';
                footer.setAttribute('data-locator', 'footer');
                footer.textContent = outline['合同尾部'];
                docPage.appendChild(footer);
            }

            state.outlineChapters = chapters;

            // Diff highlight
            if (state.prevOutlineJson) {
                highlightDocDiff();
            }
        }

        function highlightDocDiff() {
            const prevNodes = collectDocNodes(state.prevOutlineJson);
            const currNodes = collectDocNodes(state.outlineJson);
            const prevKeys = new Set(Object.keys(prevNodes));

            document.querySelectorAll('[data-locator]').forEach(el => {
                const loc = el.getAttribute('data-locator');
                if (!loc || loc === 'header' || loc === 'footer') return;
                const text = (el.textContent || '').replace(/\s+/g, ' ').trim();

                if (!prevKeys.has(loc) && currNodes[loc] !== undefined) {
                    el.classList.add('doc-highlight-new');
                } else if (prevKeys.has(loc) && prevNodes[loc] !== currNodes[loc]) {
                    el.classList.add('doc-highlight-edit');
                }
            });
        }

        function collectDocNodes(jsonObj) {
            const result = {};
            let data = jsonObj;
            if (data && data['标准化模板文本']) data = data['标准化模板文本'];
            if (!data || !Array.isArray(data['正文章节'])) return result;

            data['正文章节'].forEach(section => {
                const loc = section['locator'] || '';
                if (loc) result[loc] = ((section['章节编号'] || '') + ' ' + (section['章节标题'] || '')).trim();
                (section['条款列表'] || []).forEach(clause => {
                    const cLoc = clause['locator'] || '';
                    if (cLoc) result[cLoc] = ((clause['条款编号'] || '') + ' ' + (clause['条款大致说明'] || '')).trim();
                    (clause['子条款列表'] || []).forEach(sub => {
                        const sLoc = sub['locator'] || '';
                        if (sLoc) result[sLoc] = ((sub['子条款编号'] || '') + ' ' + (sub['子条款大致说明'] || '')).trim();
                        (sub['子子条款列表'] || []).forEach(ss => {
                            const ssLoc = ss['locator'] || '';
                            if (ssLoc) result[ssLoc] = ((ss['子子条款编号'] || '') + ' ' + (ss['子子条款大致说明'] || '')).trim();
                        });
                    });
                });
            });
            return result;
        }

        function showOutlinePanel(show) {
            const panel = document.getElementById('outlinePanel');
            const btn = document.getElementById('btnToggleOutline');
            if (show) {
                panel.classList.add('open');
                state.outlineVisible = true;
                if (state.outlineJson) btn.classList.add('active');
            } else {
                panel.classList.remove('open');
                state.outlineVisible = false;
                btn.classList.remove('active');
            }
        }

        function toggleOutlinePanel() {
            showOutlinePanel(!state.outlineVisible);
        }

        // ==================== SIDEBAR ====================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // ==================== UI HELPERS ====================
        function handleInputKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUserInput();
            }
            // Auto-resize textarea
            const ta = e.target;
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
        }

        function escHtml(s) {
            if (!s) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function fmtTime(ts) {
            const d = new Date(ts);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            if (isToday) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' +
                d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        // ==================== OUTLINE RESIZE ====================
        function initOutlineResize() {
            const handle = document.getElementById('outlineResizeHandle');
            const panel = document.getElementById('outlinePanel');
            let dragging = false;
            let startX = 0;
            let startW = 0;

            handle.addEventListener('mousedown', (e) => {
                dragging = true;
                startX = e.clientX;
                startW = panel.offsetWidth;
                handle.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const dx = startX - e.clientX;
                const newW = Math.max(240, Math.min(700, startW + dx));
                panel.style.width = newW + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (dragging) {
                    dragging = false;
                    handle.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    // Sync CSS variable
                    const panel = document.getElementById('outlinePanel');
                    if (panel.classList.contains('open')) {
                        document.documentElement.style.setProperty('--outline-width', panel.style.width || '380px');
                    }
                }
            });
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', () => {
            loadServerUrl();
            renderHistory();

            // Restore last active session
            const activeId = getActiveSessionId();
            if (activeId) {
                const sessions = loadSessions();
                const active = sessions.find(s => s.id === activeId);
                if (active) {
                    state.sessionId = active.id;
                    state.sessionTitle = active.title || '';
                    document.getElementById('headerTitle').textContent = active.title || '合同智能生成';
                    document.getElementById('chatWelcome').style.display = 'none';
                    document.getElementById('userInput').disabled = false;
                    document.getElementById('btnSend').disabled = false;
                    document.getElementById('btnSample').style.display = '';
                    document.getElementById('inputHint').textContent = '输入内容后按 Enter 发送';
                    document.getElementById('statusDot').className = 'status-dot connected';
                    renderHistory();
                    connectSSE();
                }
            }

            initOutlineResize();

            // Handle window resize
            window.addEventListener('resize', () => {
                const ta = document.getElementById('userInput');
                ta.style.height = 'auto';
            });
        });

        // Clean up on unload
        window.addEventListener('beforeunload', () => {
            if (state.sessionId) {
                updateSessionRecord(state.sessionId, { lastActive: Date.now() });
            }
            if (state.eventSource) state.eventSource.close();
        });
    </script>
</body>
