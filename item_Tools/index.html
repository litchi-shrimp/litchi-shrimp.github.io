<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="litchi-shrimp 的自制效率工具集">
    <meta name="theme-color" content="#0a1628">
    <title>Tools · litchi-shrimp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a1628;
            --surface: rgba(255, 255, 255, .04);
            --surface-hover: rgba(255, 255, 255, .08);
            --border: rgba(255, 255, 255, .07);
            --border-hover: rgba(255, 255, 255, .14);
            --text: rgba(255, 255, 255, .92);
            --text-muted: rgba(255, 255, 255, .58);
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        /* ---------- 动态背景 ---------- */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .28;
            animation: orbFloat 14s ease-in-out infinite;
        }

        .bg-orb:nth-child(1) {
            width: 520px;
            height: 520px;
            background: #6366f1;
            top: -180px;
            left: -120px;
            animation-delay: 0s;
        }

        .bg-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            top: 40%;
            right: -140px;
            animation-delay: -5s;
        }

        .bg-orb:nth-child(3) {
            width: 360px;
            height: 360px;
            background: #3b82f6;
            bottom: -140px;
            left: 30%;
            animation-delay: -9s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(40px, -30px) scale(1.06);
            }

            66% {
                transform: translate(-20px, 20px) scale(.95);
            }
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 30%, transparent 100%);
        }

        /* ---------- 主容器 ---------- */
        .container {
            position: relative;
            z-index: 1;
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        /* ---------- 头部 ---------- */
        .header {
            text-align: center;
            margin-bottom: 56px;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(99, 102, 241, .28), rgba(139, 92, 246, .22));
            border: 1px solid rgba(139, 92, 246, .24);
            margin-bottom: 24px;
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(99, 102, 241, .2);
            }

            50% {
                box-shadow: 0 0 36px rgba(139, 92, 246, .35);
            }
        }

        .header-icon svg {
            width: 30px;
            height: 30px;
            stroke: rgba(255, 255, 255, .9);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -.3px;
            margin-bottom: 10px;
            background: linear-gradient(105deg, #e2e8ff, #a5b4fc, #c4b5fd, #e2e8ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: textShimmer 4s ease infinite;
        }

        @keyframes textShimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 440px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ---------- 卡片网格 ---------- */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* ---------- 工具卡片 ---------- */
        .tool-card {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 28px 24px 22px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), border-color .3s ease, box-shadow .3s ease, background .3s ease;
            overflow: hidden;
        }

        .tool-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 18px 18px 0 0;
            opacity: 0;
            transition: opacity .3s ease;
        }

        .tool-card:nth-child(4n+1)::before {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        .tool-card:nth-child(4n+2)::before {
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
        }

        .tool-card:nth-child(4n+3)::before {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
        }

        .tool-card:nth-child(4n+4)::before {
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }

        .tool-card:hover {
            transform: translateY(-6px);
            background: var(--surface-hover);
            border-color: var(--border-hover);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .04) inset;
        }

        .tool-card:hover::before {
            opacity: 1;
        }

        .tool-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            font-size: 22px;
            flex-shrink: 0;
            transition: transform .3s ease;
        }

        .tool-card:hover .tool-icon {
            transform: scale(1.08);
        }

        .tool-icon.blue {
            background: linear-gradient(135deg, rgba(59, 130, 246, .2), rgba(99, 102, 241, .14));
            border: 1px solid rgba(99, 102, 241, .22);
            color: #818cf8;
        }

        .tool-icon.cyan {
            background: linear-gradient(135deg, rgba(6, 182, 212, .2), rgba(59, 130, 246, .14));
            border: 1px solid rgba(6, 182, 212, .22);
            color: #67e8f9;
        }

        .tool-icon.pink {
            background: linear-gradient(135deg, rgba(236, 72, 153, .2), rgba(139, 92, 246, .14));
            border: 1px solid rgba(236, 72, 153, .22);
            color: #f472b6;
        }

        .tool-icon.green {
            background: linear-gradient(135deg, rgba(16, 185, 129, .2), rgba(6, 182, 212, .14));
            border: 1px solid rgba(16, 185, 129, .22);
            color: #6ee7b7;
        }

        .tool-icon svg {
            width: 24px;
            height: 24px;
        }

        .tool-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: .2px;
        }

        .tool-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
            flex: 1;
        }

        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }

        .tool-tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            color: rgba(255, 255, 255, .6);
            white-space: nowrap;
        }

        .tool-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            color: #fff;
            align-self: flex-start;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        .tool-link:active {
            transform: scale(.97);
        }

        .tool-link.purple {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 4px 16px rgba(99, 102, 241, .28);
        }

        .tool-link.blue {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 16px rgba(59, 130, 246, .28);
        }

        .tool-link.pink {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            box-shadow: 0 4px 16px rgba(236, 72, 153, .28);
        }

        .tool-link.green {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 16px rgba(16, 185, 129, .28);
        }

        .tool-link:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .tool-link svg {
            width: 15px;
            height: 15px;
            transition: transform .2s ease;
        }

        .tool-link:hover svg {
            transform: translateX(2px);
        }

        /* ---------- 空态占位卡 ---------- */
        .tool-card.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            border-style: dashed;
            min-height: 200px;
        }

        .tool-card.placeholder .placeholder-text {
            color: rgba(255, 255, 255, .25);
            font-size: 14px;
            text-align: center;
            line-height: 1.7;
        }

        .tool-card.placeholder:hover {
            transform: none;
            border-color: var(--border);
            box-shadow: none;
            background: var(--surface);
        }

        .tool-card.placeholder:hover::before {
            opacity: 0;
        }

        /* ---------- 底部 ---------- */
        .footer {
            text-align: center;
            margin-top: 60px;
            font-size: 12px;
            color: rgba(255, 255, 255, .28);
        }

        .footer a {
            color: rgba(255, 255, 255, .4);
            text-decoration: none;
            transition: color .2s;
        }

        .footer a:hover {
            color: rgba(255, 255, 255, .7);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 768px) {
            .container {
                padding: 40px 16px 60px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                font-size: 14px;
            }

            .tools-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .tool-card {
                padding: 22px 18px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .bg-orb,
            .header-icon {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-grid"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                </svg>
            </div>
            <h1>工具箱</h1>
            <p>一些自制的效率小工具，独立开发，按需取用。每个工具都有独立链接，欢迎使用和反馈。</p>
        </header>

        <div class="tools-grid">
            <!-- PDF 转 Markdown -->
            <div class="tool-card">
                <div class="tool-icon blue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                </div>
                <div class="tool-name">PDF 转 Markdown</div>
                <div class="tool-desc">将 PDF 文档快速转换为 Markdown 格式，保留大纲、表格、公式、图片描述、分栏等结构。</div>
                <div class="tool-tags">
                    <span class="tool-tag">PDF</span>
                    <span class="tool-tag">Markdown</span>
                    <span class="tool-tag">Python</span>
                </div>
                <a class="tool-link purple" href="https://github.com/litchi-shrimp/PDF2Markdown" target="_blank"
                    rel="noopener noreferrer">
                    GitHub
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </a>
            </div>

            <!-- 占位卡片：提示更多工具即将上线 -->
            <div class="tool-card placeholder">
                <div class="placeholder-text">更多工具即将上线<br>敬请期待</div>
            </div>
        </div>

        <footer class="footer">
            <a href="https://github.com/litchi-shrimp" target="_blank"
                rel="noopener noreferrer">github.com/litchi-shrimp</a>
            &nbsp;·&nbsp;
            <a href="../index.html">返回主页</a>
        </footer>
    </div>
</body>

</html>
