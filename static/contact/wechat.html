<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码登录/关注</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 22px;
            color: #07C160;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .qrcode-container {
            padding: 20px;
            margin: 20px 0;
            border: 1px dashed #ddd;
            border-radius: 8px;
            position: relative;
        }

        .qrcode-img {
            width: 100%;
            max-width: 250px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .refresh-btn {
            background-color: #07C160;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background-color: #06AD56;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

        .wechat-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 15px;
        }

        .instructions {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            font-size: 13px;
        }

        .instructions ol {
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scan-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0), rgba(7, 193, 96, 0.1));
            animation: scan 2s infinite;
            border-radius: 8px;
            opacity: 0;
        }

        @keyframes scan {
            0% {
                opacity: 0;
                top: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 0;
                top: 100%;
            }
        }

        .qrcode-container:hover .scan-animation {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <svg class="wechat-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                <path fill="#07C160"
                    d="M1012.8 661.6c-22-108-96.8-199.2-200-248-104.8-49.6-224-40-320.8 24.8-96.8 64.8-156 168-156 280.8 0 32.8 4.8 65.6 14.4 96.8l-32 104 112-24c28.8 8 57.6 12 88 12 48 0 96-9.6 140-28l12-4 88 44-24-80c72-48 124.8-116.8 148.8-196.8l8-32-8-16zM512 800c-28.8 0-57.6-4-84-12l-16-4-80 16 16-56c-12-32-20-64-20-96 0-92.8 48.8-176 128-224 80-48 180-64 268-32 88 32 156 104 180 192 24 88 0 180-64 252-16 20-36 36-56 52l-8 4 16 56-64-32-16-8c-44 16-92 24-140 24zM296 420c-26.4 0-48-21.6-48-48s21.6-48 48-48 48 21.6 48 48-21.6 48-48 48z m264 0c-26.4 0-48-21.6-48-48s21.6-48 48-48 48 21.6 48 48-21.6 48-48 48z">
                </path>
            </svg>
            <h1>微信扫码加好友</h1>
            <p>请使用微信扫描二维码完成操作</p>
        </div>

        <div class="qrcode-container">
            <img class="qrcode-img" src="Wechat.png" alt="微信二维码">
            <div class="scan-animation"></div>
        </div>

        <button class="refresh-btn">刷新二维码</button>

        <div class="instructions">
            <h3>操作指引：</h3>
            <ol>
                <li>打开微信，点击右上角"+"号</li>
                <li>选择"扫一扫"功能</li>
                <li>将手机摄像头对准上方二维码</li>
                <li>根据提示完成后续操作</li>
            </ol>
        </div>

        <div class="footer">
            <p>如有问题，请联系客服微信：customer-service</p>
        </div>
    </div>

    <script>
        // 简单的刷新按钮交互
        document.querySelector('.refresh-btn').addEventListener('click', function () {
            const qrcodeContainer = document.querySelector('.qrcode-container');
            qrcodeContainer.style.opacity = '0.5';

            // 模拟刷新效果
            setTimeout(() => {
                qrcodeContainer.style.opacity = '1';
                alert('二维码已刷新，请重新扫描');
            }, 800);
        });
    </script>
</body>

</html>
